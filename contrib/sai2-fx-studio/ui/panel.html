<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SAI2 FX Studio</title>
<style>
  :root {
    --fx-bg: rgba(28, 30, 38, 0.72);
    --fx-panel: rgba(48, 51, 62, 0.66);
    --fx-panel2: rgba(64, 68, 80, 0.55);
    --fx-line: rgba(255, 255, 255, 0.12);
    --fx-text: #eef0f6;
    --fx-dim: #a8adbd;
    --fx-accent: var(--accent, #7aa2ff);
    --fx-radius: var(--radius, 12px);
    --fx-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    color: var(--fx-text);
    background: var(--fx-bg);
    backdrop-filter: blur(24px) saturate(150%);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    border: 1px solid var(--fx-line);
    border-radius: var(--fx-radius);
    box-shadow: var(--fx-shadow);
    overflow: hidden;
    font-size: 13px;
  }
  /* 自绘标题栏 */
  .titlebar {
    height: 38px; display: flex; align-items: center; gap: 10px;
    padding: 0 12px; background: var(--fx-panel);
    border-bottom: 1px solid var(--fx-line);
    -webkit-app-region: drag; user-select: none;
  }
  .titlebar .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--fx-accent); }
  .titlebar .name { font-weight: 600; letter-spacing: .3px; }
  .titlebar .ver { color: var(--fx-dim); font-size: 11px; }
  .titlebar .spacer { flex: 1; }
  .titlebar button {
    -webkit-app-region: no-drag; border: 0; color: var(--fx-text);
    background: transparent; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 15px;
  }
  .titlebar button:hover { background: var(--fx-panel2); }

  .layout { display: flex; height: calc(100% - 38px); }
  .tabs {
    width: 96px; flex: none; background: var(--fx-panel);
    border-right: 1px solid var(--fx-line); padding: 10px 6px; display: flex; flex-direction: column; gap: 4px;
  }
  .tabs button {
    border: 0; background: transparent; color: var(--fx-dim); text-align: left;
    padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .tabs button.active { background: var(--fx-panel2); color: var(--fx-text); box-shadow: inset 2px 0 var(--fx-accent); }
  .tabs .foot { margin-top: auto; font-size: 10px; color: var(--fx-dim); padding: 6px; line-height: 1.5; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .layers {
    height: 122px; flex: none; border-bottom: 1px solid var(--fx-line);
    padding: 8px 12px; overflow: auto;
  }
  .layers .hd { color: var(--fx-dim); font-size: 11px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .layers .hd button {
    border: 1px solid var(--fx-line); background: var(--fx-panel2); color: var(--fx-text);
    border-radius: 6px; padding: 2px 9px; cursor: pointer; font-size: 11px;
  }
  .layer-row { padding: 4px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .layer-row:hover { background: var(--fx-panel2); }
  .layer-row.sel { background: var(--fx-accent); color: #fff; }

  .stage { flex: 1; display: flex; min-height: 0; }
  .canvas-wrap {
    flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center;
    padding: 12px; overflow: hidden;
    background:
      linear-gradient(45deg, rgba(255,255,255,.04) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.04) 75%),
      linear-gradient(45deg, rgba(255,255,255,.04) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.04) 75%);
    background-size: 18px 18px; background-position: 0 0, 9px 9px;
  }
  .canvas-wrap canvas { max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: 0 4px 18px rgba(0,0,0,.4); }
  .canvas-wrap .empty { color: var(--fx-dim); text-align: center; line-height: 1.8; }

  .params { width: 248px; flex: none; border-left: 1px solid var(--fx-line); background: var(--fx-panel); padding: 12px; overflow: auto; }
  .params h3 { margin: 0 0 10px; font-size: 13px; }
  .row { margin-bottom: 12px; }
  .row label { display: flex; justify-content: space-between; color: var(--fx-dim); font-size: 11px; margin-bottom: 5px; }
  .row input[type=range] { width: 100%; accent-color: var(--fx-accent); }
  .row select, .row input[type=text], .row input[type=number] {
    width: 100%; background: var(--fx-panel2); color: var(--fx-text);
    border: 1px solid var(--fx-line); border-radius: 6px; padding: 5px 7px; font-size: 12px;
  }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions button {
    flex: 1; border: 0; border-radius: 8px; padding: 9px; cursor: pointer; font-size: 12px;
    background: var(--fx-panel2); color: var(--fx-text);
  }
  .actions button.primary { background: var(--fx-accent); color: #fff; }
  .actions button:disabled { opacity: .45; cursor: not-allowed; }
  .toast {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    background: rgba(0,0,0,.72); color: #fff; padding: 7px 14px; border-radius: 20px;
    font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="titlebar">
    <span class="dot"></span>
    <span class="name">SAI2 FX Studio</span>
    <span class="ver">非官方 · v0.1.0</span>
    <span class="spacer"></span>
    <button id="btn-close" title="关闭">✕</button>
  </div>
  <div class="layout">
    <div class="tabs" id="tabs">
      <button data-tab="liquify" class="active">液化</button>
      <button data-tab="blur">模糊</button>
      <button data-tab="filter">滤镜</button>
      <button data-tab="adjust">调整</button>
      <div class="foot">UI/核心为原创重写<br>算法移植自 MIT 项目<br>详见「关于」</div>
      <button data-tab="about">关于</button>
    </div>
    <div class="main">
      <div class="layers">
        <div class="hd">
          <span>图层（点选后抓取）</span>
          <button id="btn-refresh">刷新图层</button>
          <button id="btn-inject">连接注入</button>
          <button id="btn-whitelist" title="以管理员身份运行随包的添加白名单.bat">加白名单</button>
          <button id="btn-grab">抓取当前图层</button>
        </div>
        <div id="layer-list"><div class="layer-row" style="color:var(--fx-dim)">未连接注入器，点「刷新图层」重试</div></div>
      </div>
      <div class="stage">
        <div class="canvas-wrap" id="canvas-wrap">
          <canvas id="preview" style="display:none"></canvas>
          <div class="empty" id="empty">尚未抓取图层<br>先在 SAI2 打开一幅画，再点「抓取当前图层」</div>
        </div>
        <div class="params" id="params"></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
(function () {
  'use strict'
  var bridge = window.pluginBridge
  var state = { tab: 'liquify', effect: '', params: {}, layers: [], sel: -1, hasImage: false, agentOk: false }

  function send(type, extra) {
    if (!bridge) return toast('浮窗通信未就绪')
    var msg = { type: type }
    if (extra) for (var k in extra) msg[k] = extra[k]
    bridge.send(msg)
  }
  function toast(text) {
    var t = document.getElementById('toast')
    t.textContent = text; t.classList.add('show')
    clearTimeout(t._timer)
    t._timer = setTimeout(function () { t.classList.remove('show') }, 1800)
  }

  // ---- 参数界面定义 ----
  var DEFS = {
    liquify: {
      title: '液化', effects: [
        { id: 'forward', name: '向前变形', params: [['radius', '笔刷半径', 'range', 1, 80, 24], ['strength', '强度', 'range', 0.1, 3, 1]] },
        { id: 'inflate', name: '膨胀', params: [['radius', '笔刷半径', 'range', 1, 80, 24], ['amount', '强度', 'range', -3, 3, 1]] },
        { id: 'swirl', name: '旋转', params: [['radius', '笔刷半径', 'range', 1, 80, 24], ['angle', '角度', 'range', -1, 1, 0.4]] },
        { id: 'smooth', name: '平滑', params: [['radius', '笔刷半径', 'range', 1, 80, 24], ['amount', '强度', 'range', 0.1, 2, 1]] }
      ]
    },
    blur: {
      title: '模糊', effects: [
        { id: 'gaussian', name: '高斯模糊', params: [['radius', '半径', 'range', 0, 40, 5], ['sigma', 'Sigma', 'range', 0.5, 10, 2]] },
        { id: 'box', name: '盒式模糊', params: [['radius', '半径', 'range', 0, 40, 6]] },
        { id: 'motion', name: '运动模糊', params: [['distance', '距离', 'range', 0, 40, 8], ['angle', '角度', 'range', 0, 360, 0]] },
        { id: 'zoom', name: '缩放模糊', params: [['strength', '强度', 'range', 0, 1, 0.3]] }
      ]
    },
    filter: {
      title: '滤镜', effects: [
        { id: 'sharpen', name: '锐化', params: [['amount', '强度', 'range', 0.5, 3, 1]] },
        { id: 'emboss', name: '浮雕', params: [] },
        { id: 'edge', name: '边缘', params: [] },
        { id: 'sepia', name: '怀旧', params: [] },
        { id: 'cool', name: '冷色', params: [] },
        { id: 'warm', name: '暖色', params: [] },
        { id: 'bw', name: '高对比黑白', params: [['threshold', '阈值', 'range', 0, 255, 128]] },
        { id: 'soften', name: '柔光', params: [['amount', '强度', 'range', 0, 1, 0.5]] },
        { id: 'pixelate', name: '像素化', params: [['block', '块大小', 'range', 2, 32, 8]] },
        { id: 'mosaic', name: '马赛克', params: [['block', '块大小', 'range', 2, 32, 8]] }
      ]
    },
    adjust: {
      title: '调整', effects: [
        { id: 'invert', name: '反相', params: [] },
        { id: 'grayscale', name: '去色', params: [] },
        { id: 'brightnessContrast', name: '亮度对比度', params: [['brightness', '亮度', 'range', -100, 100, 0], ['contrast', '对比度', 'range', -100, 100, 0]] },
        { id: 'hueSaturation', name: '色相饱和度', params: [['hue', '色相', 'range', -180, 180, 0], ['saturation', '饱和度', 'range', 0, 2, 1], ['lightness', '明度', 'range', 0, 2, 1]] },
        { id: 'levels', name: '色阶', params: [['black', '黑场', 'range', 0, 255, 0], ['white', '白场', 'range', 0, 255, 255], ['gamma', 'Gamma', 'range', 0.1, 3, 1]] }
      ]
    }
  }

  function renderParams() {
    var box = document.getElementById('params')
    if (state.tab === 'about') {
      box.innerHTML = '<h3>关于</h3><div style="color:var(--fx-dim);line-height:1.8;font-size:12px">' +
        'UI 层与核心引擎为原创重写；算法逻辑移植自 MIT 项目 PainterAnkry/sai2-plugin-suite。<br><br>' +
        '随包附带上游 MIT 套件 v1.64.0（Celery fork），原样分发、未修改；打开浮窗默认自动注入。<br><br>' +
        '首次使用若被杀软拦截，点「加白名单」以管理员运行随包脚本（UAC 需你确认）。<br><br>' +
        '非官方作品，与上游作者及分享者无背书关系。使用注入类工具请自行评估风险并备份画作。</div>'
      return
    }
    var def = DEFS[state.tab]
    var html = '<h3>' + def.title + '</h3>'
    html += '<div class="row"><label>效果</label><select id="effect">'
    def.effects.forEach(function (e) {
      html += '<option value="' + e.id + '"' + (state.effect === e.id ? ' selected' : '') + '>' + e.name + '</option>'
    })
    html += '</select></div>'
    var eff = def.effects.find(function (e) { return e.id === state.effect }) || def.effects[0]
    eff.params.forEach(function (p) {
      var val = state.params[p[0]] == null ? p[5] : state.params[p[0]]
      html += '<div class="row"><label><span>' + p[1] + '</span><span id="v-' + p[0] + '">' + val + '</span></label>' +
        '<input type="range" data-key="' + p[0] + '" min="' + p[2] + '" max="' + p[3] + '" step="' + (p[0] === 'angle' && state.tab === 'filter' ? 1 : (Math.abs(p[4]) < 1 ? 0.05 : (p[4] < 5 ? 0.1 : 1))) + '" value="' + val + '"></div>'
    })
    html += '<div class="actions">' +
      '<button id="btn-preview">预览</button>' +
      '<button id="btn-apply" class="primary"' + (state.hasImage ? '' : ' disabled') + '>应用并贴回</button>' +
      '</div><div class="actions"><button id="btn-undo">撤销</button><button id="btn-reset">复位</button></div>'
    box.innerHTML = html

    document.getElementById('effect').onchange = function (e) {
      state.effect = e.target.value
      var ne = def.effects.find(function (x) { return x.id === state.effect })
      state.params = {}
      ne.params.forEach(function (p) { state.params[p[0]] = p[5] })
      send('effect', { tab: state.tab, effect: state.effect, params: state.params })
      renderParams()
    }
    box.querySelectorAll('input[type=range]').forEach(function (el) {
      el.oninput = function () {
        var key = el.dataset.key
        state.params[key] = Number(el.value)
        var label = document.getElementById('v-' + key)
        if (label) label.textContent = el.value
        send('param', { tab: state.tab, effect: state.effect, key: key, value: Number(el.value) })
      }
      el.onchange = function () { send('preview', { tab: state.tab, effect: state.effect, params: state.params }) }
    })
    document.getElementById('btn-preview').onclick = function () { send('preview', { tab: state.tab, effect: state.effect, params: state.params }) }
    document.getElementById('btn-apply').onclick = function () { send('apply', { tab: state.tab, effect: state.effect, params: state.params }) }
    document.getElementById('btn-undo').onclick = function () { send('undo') }
    document.getElementById('btn-reset').onclick = function () { send('reset') }
  }

  function renderLayers() {
    var box = document.getElementById('layer-list')
    if (!state.layers.length) {
      box.innerHTML = '<div class="layer-row" style="color:var(--fx-dim)">' + (state.agentOk ? '未识别到图层，先在 SAI2 里点一下图层面板' : '未连接注入器，点「刷新图层」重试') + '</div>'
      return
    }
    box.innerHTML = ''
    state.layers.forEach(function (r, i) {
      var d = document.createElement('div')
      d.className = 'layer-row' + (i === state.sel ? ' sel' : '')
      d.textContent = '#' + (i + 1) + '  ' + r.text
      d.onclick = function () { state.sel = i; renderLayers(); send('selectLayer', { index: i, row: r }) }
      box.appendChild(d)
    })
  }

  function showImage(dataUrl) {
    var canvas = document.getElementById('preview')
    var empty = document.getElementById('empty')
    if (!dataUrl) { canvas.style.display = 'none'; empty.style.display = 'block'; state.hasImage = false; return }
    var img = new Image()
    img.onload = function () {
      var maxW = document.getElementById('canvas-wrap').clientWidth - 24
      var maxH = document.getElementById('canvas-wrap').clientHeight - 24
      var s = Math.min(1, maxW / img.width, maxH / img.height)
      canvas.width = Math.max(1, Math.round(img.width * s))
      canvas.height = Math.max(1, Math.round(img.height * s))
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height)
      canvas.style.display = 'block'
      empty.style.display = 'none'
      state.hasImage = true
      var apply = document.getElementById('btn-apply')
      if (apply) apply.disabled = false
    }
    img.src = dataUrl
  }

  // tabs
  document.getElementById('tabs').querySelectorAll('button[data-tab]').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('#tabs button').forEach(function (x) { x.classList.remove('active') })
      b.classList.add('active')
      state.tab = b.dataset.tab
      var def = DEFS[state.tab]
      if (def && !def.effects.some(function (e) { return e.id === state.effect })) {
        state.effect = def.effects[0].id
        state.params = {}
        def.effects[0].params.forEach(function (p) { state.params[p[0]] = p[5] })
      }
      renderParams()
    }
  })
  document.getElementById('btn-close').onclick = function () { send('close') }
  document.getElementById('btn-refresh').onclick = function () { send('refreshLayers') }
  document.getElementById('btn-inject').onclick = function () { toast('正在连接注入器…'); send('inject') }
  document.getElementById('btn-whitelist').onclick = function () { toast('请在 UAC 弹窗中确认'); send('whitelist') }
  document.getElementById('btn-grab').onclick = function () { send('grab') }

  // 初始化默认效果
  (function init() {
    var def = DEFS[state.tab]
    state.effect = def.effects[0].id
    def.effects[0].params.forEach(function (p) { state.params[p[0]] = p[5] })
    renderParams()
  })()

  // 接收插件消息
  if (bridge) {
    bridge.onMessage(function (msg) {
      if (!msg || !msg.type) return
      switch (msg.type) {
        case 'layers':
          state.layers = msg.layers || []
          state.agentOk = !!msg.ok
          renderLayers()
          break
        case 'image':
          showImage(msg.dataUrl)
          break
        case 'status':
          toast(msg.text || '')
          break
        case 'cleared':
          showImage(null)
          break
      }
    })
  }
})()
</script>
</body>
</html>
